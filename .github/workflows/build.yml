name: Build Zig Game

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig 0.16
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libwayland-dev

      - name: Build Game
        run: zig build -Doptimize=ReleaseFast

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brainix-Runner-${{ matrix.os }}
          path: zig-out/bin/*

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: zig-out/bin/*




publish-binaries:
    name: Commit compiled binaries
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Download Linux executable
    uses: actions/download-artifact@v4
    with:
      name: Brainix-Runner-ubuntu-latest
      path: binaries/linux

  - name: Download Windows executable
    uses: actions/download-artifact@v4
    with:
      name: Brainix-Runner-windows-latest
      path: binaries/windows

  - name: Download macOS executable
    uses: actions/download-artifact@v4
    with:
      name: Brainix-Runner-macos-latest
      path: binaries/macos

  - name: Set executable permissions
    run: |
      chmod +x binaries/linux/Brainix_Runner
      chmod +x binaries/macos/Brainix_Runner

  - name: Commit and push binaries
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add binaries/

      if git diff --cached --quiet; then
        echo "No binary changes to commit."
        exit 0
      fi

   
      git fetch origin main
      if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
        echo "Main has advanced; skipping outdated binaries."
        exit 0
      fi

      git commit -m "chore: update compiled binaries [skip ci]"
      git push origin HEAD:main
